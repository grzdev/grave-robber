<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="260" style="background:#07050d; border-radius: 16px; border: 1px solid rgba(147, 51, 234, 0.4); box-shadow: 0 0 40px rgba(147, 51, 234, 0.15); overflow: hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05030a"/>
      <stop offset="100%" stop-color="#0c0818"/>
    </linearGradient>

    <radialGradient id="lanternBeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#eab308" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="tombAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter for subtle retro pixel glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* Keyframe Animations */
    @keyframes robberJumpLoop {
      0% {
        transform: translate(60px, 150px);
      }
      22% {
        transform: translate(190px, 150px); /* Running on floor */
      }
      38% {
        transform: translate(290px, 70px); /* Peak of jump in air */
      }
      52% {
        transform: translate(370px, 105px); /* Lands on stepping stone */
      }
      70% {
        transform: translate(470px, 105px); /* Approaches tomb on dais */
      }
      82% {
        transform: translate(500px, 105px); /* Pauses & inspects */
      }
      92% {
        transform: translate(500px, 105px); /* Plunders */
      }
      100% {
        transform: translate(60px, 150px); /* Loops back */
      }
    }

    @keyframes lanternBob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(3px); }
    }

    @keyframes torchFlicker {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      25% { transform: scale(0.92, 1.08); opacity: 0.85; }
      50% { transform: scale(1.08, 0.95); opacity: 1; }
      75% { transform: scale(0.95, 1.04); opacity: 0.88; }
    }

    @keyframes emberRise {
      0% { transform: translate(0, 0); opacity: 0.9; }
      100% { transform: translate(-15px, -60px); opacity: 0; }
    }

    @keyframes tombPulse {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.15); opacity: 0.8; }
    }

    @keyframes coinBurst {
      0%, 78% { opacity: 0; transform: translate(0, 0) scale(0.5); }
      84% { opacity: 1; transform: translate(0, -35px) scale(1.2); }
      96% { opacity: 0; transform: translate(0, -55px) scale(0.9); }
      100% { opacity: 0; }
    }

    .anim-robber {
      animation: robberJumpLoop 6.5s infinite cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .anim-torch {
      animation: torchFlicker 0.25s infinite alternate ease-in-out;
      transform-origin: 80px 105px;
    }
    .anim-torch2 {
      animation: torchFlicker 0.3s infinite alternate ease-in-out;
      transform-origin: 720px 105px;
    }
    .anim-ember1 { animation: emberRise 1.8s infinite linear; }
    .anim-ember2 { animation: emberRise 2.3s infinite linear 0.7s; }
    .anim-tomb-aura { animation: tombPulse 2.5s infinite ease-in-out; transform-origin: 580px 145px; }
    .anim-coins { animation: coinBurst 6.5s infinite ease-out; transform-origin: 580px 120px; }
  </style>

  <!-- Background Stone Wall Grid -->
  <rect width="800" height="260" fill="url(#bgGrad)"/>
  <path d="M 0,40 L 800,40 M 0,80 L 800,80 M 0,120 L 800,120 M 0,160 L 800,160 M 0,200 L 800,200" stroke="#151026" stroke-width="1.2"/>
  <path d="M 60,0 L 60,260 M 160,0 L 160,260 M 260,0 L 260,260 M 360,0 L 360,260 M 460,0 L 460,260 M 560,0 L 560,260 M 660,0 L 660,260 M 760,0 L 760,260" stroke="#151026" stroke-width="1.2"/>

  <!-- Left Wall Torch -->
  <circle cx="80" cy="100" r="45" fill="url(#torchGlow)"/>
  <rect x="77" y="105" width="6" height="18" fill="#453322" rx="1"/>
  <rect x="74" y="103" width="12" height="4" fill="#694d30" rx="1"/>
  <path d="M 80,92 C 86,98 84,106 80,107 C 76,106 74,98 80,92 Z" fill="#f59e0b" class="anim-torch"/>
  <circle cx="80" cy="101" r="3" fill="#fef08a"/>
  <!-- Embers -->
  <circle cx="78" cy="95" r="1.5" fill="#fde047" class="anim-ember1"/>
  <circle cx="82" cy="92" r="1.2" fill="#f97316" class="anim-ember2"/>

  <!-- Right Wall Torch -->
  <circle cx="720" cy="100" r="45" fill="url(#torchGlow)"/>
  <rect x="717" y="105" width="6" height="18" fill="#453322" rx="1"/>
  <rect x="714" y="103" width="12" height="4" fill="#694d30" rx="1"/>
  <path d="M 720,92 C 726,98 724,106 720,107 C 716,106 714,98 720,92 Z" fill="#c084fc" class="anim-torch2"/>
  <circle cx="720" cy="101" r="3" fill="#f3e8ff"/>

  <!-- Ground Platform -->
  <rect x="0" y="200" width="800" height="60" fill="#140f22" stroke="#2e2246" stroke-width="2"/>
  <rect x="0" y="200" width="800" height="4" fill="#251b38"/>

  <!-- Intermediate Stepping Stone (x: 350, y: 155, w: 75, h: 14) -->
  <rect x="350" y="155" width="75" height="14" fill="#1c162e" stroke="#4a3b68" stroke-width="1.8" rx="2"/>
  <rect x="350" y="155" width="75" height="3" fill="#2e2448"/>

  <!-- Tomb Dais (x: 520, y: 155, w: 120, h: 45) -->
  <rect x="520" y="155" width="120" height="45" fill="#181228" stroke="#3d2f58" stroke-width="2" rx="3"/>
  <rect x="520" y="155" width="120" height="4" fill="#2a1f40"/>

  <!-- Sarcophagus Tomb (x: 555, y: 125) -->
  <circle cx="580" cy="135" r="50" fill="url(#tombAura)" class="anim-tomb-aura"/>
  <rect x="555" y="127" width="50" height="28" fill="#261c3b" stroke="#a855f7" stroke-width="2" rx="3"/>
  <path d="M 565,127 A 15,15 0 0,1 595,127 Z" fill="#3b2b5c" stroke="#c084fc" stroke-width="2"/>
  <text x="580" y="145" font-size="12" text-anchor="middle" fill="#e9d5ff">🪦</text>
  <text x="580" y="112" font-size="9" font-family="'Press Start 2P', monospace, sans-serif" text-anchor="middle" fill="#34d399">1000 XTR</text>

  <!-- Coin Burst on Plunder -->
  <g class="anim-coins">
    <text x="565" y="115" font-size="14">🪙</text>
    <text x="580" y="105" font-size="15">✨</text>
    <text x="595" y="115" font-size="14">🪙</text>
  </g>

  <!-- Player Character (Grave Robber with Animated Jump & Lantern) -->
  <g class="anim-robber">
    <!-- Lantern Light Aura -->
    <circle cx="28" cy="22" r="65" fill="url(#lanternBeam)"/>

    <!-- Cloak Body -->
    <rect x="4" y="12" width="18" height="28" fill="#3b1d60" rx="3"/>
    <path d="M 4,40 L 0,46 L 22,46 L 18,40 Z" fill="#281144"/>

    <!-- Hood -->
    <circle cx="13" cy="10" r="9" fill="#210a38"/>
    <!-- Glowing Cyan Eyes -->
    <rect x="15" y="8" width="2.5" height="2.5" fill="#22d3ee" filter="url(#softGlow)"/>
    <rect x="19" y="8" width="2.5" height="2.5" fill="#22d3ee" filter="url(#softGlow)"/>

    <!-- Lantern in Hand -->
    <g class="anim-lantern" style="animation: lanternBob 0.6s infinite ease-in-out;">
      <line x1="26" y1="14" x2="26" y2="19" stroke="#92400e" stroke-width="1.5"/>
      <rect x="23" y="19" width="6" height="9" fill="#b45309" stroke="#f59e0b" stroke-width="1" rx="1"/>
      <circle cx="26" cy="23.5" r="3" fill="#fef08a" filter="url(#softGlow)"/>
    </g>
  </g>

  <!-- Bottom Aesthetic Badge -->
  <rect x="270" y="218" width="260" height="24" rx="12" fill="rgba(10, 7, 20, 0.85)" stroke="#6366f1" stroke-width="1"/>
  <text x="400" y="234" font-size="10" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle" fill="#c7d2fe" font-weight="600" letter-spacing="0.5">
    ⚡ Tari Ootle Stealth Payouts &bull; Sapient dApp
  </text>
</svg>
